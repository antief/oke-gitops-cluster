apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: envoy-gateway-system
  annotations:
    external-dns.alpha.kubernetes.io/controller: ignored
spec:
  parentRefs:
    - name: public
      sectionName: http
    - name: public
      sectionName: http-apex
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
