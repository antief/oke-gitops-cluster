apiVersion: batch/v1
kind: CronJob
metadata:
  name: betterstack-heartbeat
  namespace: uptime-monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: betterstack-heartbeat
            app.kubernetes.io/component: uptime-heartbeat
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: heartbeat
              image: docker.io/curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${BETTERSTACK_HEARTBEAT_K8S_SECRET_NAME}
                      key: url
              command:
                - sh
                - -ec
                - |
                  curl -fsS --retry 3 --retry-delay 2 --max-time 10 "$HEARTBEAT_URL"
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
          securityContext:
            seccompProfile:
              type: RuntimeDefault
