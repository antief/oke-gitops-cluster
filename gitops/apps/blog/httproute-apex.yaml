apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-apex
  namespace: blog
  labels:
    external-dns-scope: apex
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https-apex
  hostnames:
    - ${BASE_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: blog
          port: 80
